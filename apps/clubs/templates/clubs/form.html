{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<form method="post" novalidate class="panel">{% csrf_token %}
  {% include "includes/form.html" %}
  <div class="actions"><button type="submit">Save</button>{% if club %}<a href="{% url 'clubs:detail' club.pk %}">Cancel</a>{% else %}<a href="{% url 'clubs:list' %}">Cancel</a>{% endif %}</div>
</form>
{% endblock %}
