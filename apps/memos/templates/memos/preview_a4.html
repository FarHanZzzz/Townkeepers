{% extends "base.html" %}
{% block title %}Preview {{ memo.reference }}{% endblock %}
{% block content %}
<style>
  .memo-a4 { background: #fff; width: 100%; max-width: 210mm; min-height: 297mm; margin: 0 auto; padding: 18mm; border: 1px solid #c9ced6; position: relative; font-family: Georgia, "Times New Roman", serif; }
  .memo-head { text-align: center; } .memo-head p { margin: .1rem 0; } .memo-institution { font-weight: 700; } .memo-title { font-size: 1.3rem; }
  .memo-rows th { width: 7rem; background: none; border: none; } .memo-rows td { border: none; }
  .memo-watermark { position: absolute; top: 40%; left: 0; right: 0; text-align: center; font-size: 6rem; color: rgba(160, 30, 30, .15); transform: rotate(-25deg); pointer-events: none; margin: 0; }
  .memo-status { font-family: system-ui, sans-serif; font-size: .9rem; border-bottom: 1px dashed #c9ced6; padding-bottom: .4rem; }
  .memo-sig { break-inside: avoid; margin-top: 1rem; }
</style>
<div class="actions">
  <a href="{% url 'memos:detail' memo.pk %}">Back to memo</a>
  <form method="post" action="{% url 'memos:export' memo.pk %}">{% csrf_token %}{% if version %}<input type="hidden" name="version" value="{{ version.number }}">{% endif %}<button type="submit" class="secondary">Export A4 PDF</button></form>
</div>
{% include "memos/_memo_body.html" %}
{% endblock %}
