# Reproducible local PostgreSQL for teammates with Docker. Windows setup without Docker: see README.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: townhall
      POSTGRES_PASSWORD: townhall_local
      POSTGRES_DB: townhall
    ports:
      - "5432:5432"
    volumes:
      - townhall-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U townhall"]
      interval: 5s
      retries: 10

volumes:
  townhall-pg:
