[project]
name = "amader-townhall"
version = "0.1.0"
description = "Amader TOWNHALL club administration for IUB (Townkeepers)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<7",
    "psycopg[binary]>=3.2,<4",
    "django-environ>=0.11,<1",
    "authlib>=1.3,<2",
    "requests>=2.32,<3",
    "python-dateutil>=2.9,<3",
    "xhtml2pdf>=0.2.16,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.8,<3",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-django>=4.9,<5",
    "pytest-cov>=5,<8",
    "factory-boy>=3.3,<4",
    "freezegun>=1.5,<2",
    "pytest-playwright>=0.5,<1",
    "interrogate>=1.7,<2",
    "sphinx>=8,<10",
    "ruff>=0.6,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*.py", "docs/sphinx/_build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM"]
ignore = ["S101", "S105", "S106"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"config/settings/*.py" = ["F405", "F403"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "req(*ids): PRD requirement identifiers (FR, UC, BR, NFR, AC) covered by the test",
    "race: PostgreSQL concurrency test using independent connections",
    "browser: Playwright browser journey (requires `playwright install chromium`)",
]

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-private = true
ignore-semiprivate = true
ignore-nested-functions = true
fail-under = 90
exclude = ["**/migrations", "tests", "docs"]

[tool.coverage.run]
source = ["apps", "assistance", "config"]
omit = ["**/migrations/*"]
